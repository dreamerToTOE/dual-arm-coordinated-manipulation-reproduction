# TASK01 core single-Cube candidate.
# Do not use for formal comparison until TASK01 is PASS and user marks it FROZEN.
schema_version: 2
benchmark_id: benchmark_v1
status: DRAFT
scientific_classification: ADAPTATION
scope: staged_single_cube_tight_transport_handoff_and_constrained_insertion
units: {length: m, mass: kg, time: s, angle: rad, force: N, torque: Nm}

prior_project_reuse:
  repository: dreamerToTOE/dual-arm-embodied-palletizing
  branch: side-suction-palletizing
  policy_doc: docs/PRIOR_PROJECT_REUSE.md
  task24_bilateral_transport: VALIDATED_ENGINEERING_REFERENCE
  task26_task27_rear_push: VALIDATED_ENGINEERING_REFERENCE
  full_task27_five_cube_flow:
    role: application_demo_and_stress_test_only
    blocks_benchmark_freeze: false

frames:
  world: world
  cube: cube_center
  carriage_entrance:
    name: carriage_entrance
    origin_world_m: [0.910, 0.000, 0.200]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    axes:
      x: insertion_forward
      y: carriage_width
      z: up
    validation: PENDING_FINAL_READY

robots:
  model: dual_fr3_side_suction
  left:
    base_at_rest_world_m: [0.650, -0.600, 0.000]
    rail_axis_world: [1.0, 0.0, 0.0]
    rail_x_limits_world_m: [0.450, 1.050]
    tcp_link: left_fr3_side_suction_tcp
  right:
    base_at_rest_world_m: [0.650, 0.600, 0.000]
    rail_axis_world: [1.0, 0.0, 0.0]
    rail_x_limits_world_m: [0.450, 1.050]
    tcp_link: right_fr3_side_suction_tcp

  # [ADAPTATION] D039 用户批准的 fixed handoff；不是算法优化变量。
  # base_at_rest 保持 .650；INSERT_READY .750 仍需实测捕获/验收，不自行 FROZEN。
  rail_state_candidates:
    A_and_pre_push_shared: &a_rail_state
      left_x_world_m: 0.650
      right_x_world_m: 0.650
      world_shift_x_m: 0.000
    INSERT_READY: &insert_ready_rail_state
      left_x_world_m: 0.750
      right_x_world_m: 0.750
      world_shift_x_m: 0.100
      role: fixed_common_engineering_handoff_not_p3_parameter
      optimization_allowed: false
      status: USER_APPROVED_CANDIDATE_PENDING_MEASURED_CAPTURE

  # [EXPERIMENTAL] actual candidate from the completed START→PRE_PUSH geometry chain.
  benchmark_a_start_joint_state_rad: &benchmark_a_start_q
    left: [0.6556998327304024, -0.9158460955296517, 0.9361619490344238, -2.43079576661854, 0.7029262366728565, 1.726259984792982, 1.2164416425071283]
    right: [-0.47514226618537353, -1.1301697571742122, -0.9979978814517659, -2.404800398376118, -0.8636013246419576, 1.5572941255153623, -1.0752371378447552]

  pre_push_shared_joint_state_rad: &pre_push_shared_q
    left: [0.21744143569271313, -0.5164914914460937, 1.0171641693028668, -2.6091513733003326, 0.5632971965150655, 2.2361990887058414, 0.7985013134114293]
    right: [0.03097153340224297, -0.8182678884154884, -1.2267956826752937, -2.5710825559909845, -0.8729224205691766, 2.028938813811622, -0.5717471798134617]

  insert_ready_joint_state_rad: PENDING_CAPTURE_FROM_REUSED_REAR_REGRASP
  start_joint_state_validation: A_GEOMETRY_PASS_B_INSERT_READY_PENDING_REUSE_CAPTURE
  start_joint_state_evidence: results/20261007_TASK01_full_single_cube_geometry01/state_records.json

table:
  center_world_m: [0.550, 0.000, 0.100]
  size_m: [1.500, 0.800, 0.200]
  top_world_z_m: 0.200

cube:
  count: 1
  size_m: [0.120, 0.120, 0.120]
  mass_kg: 0.800
  nominal_center_z_m: 0.260
  nominal_material:
    static_friction: 0.50
    dynamic_friction: 0.50
    restitution: 0.0
  material_basis: measured_effective_in_inherited_task01_scene
  robustness_variation: DEFERRED_TO_P3

tool:
  type: fixed_L_side_suction_2x2
  vertical_drop_m: 0.080
  lateral_standoff_m: 0.130
  tcp_lateral_offset_from_link8_m: 0.155
  geometry_change_allowed_in_task01: false

shared_grasp:
  applies_to: [A_tight_transport, handoff_pre_release]
  mode: bilateral_side_surface_gripper
  object_to_left_tcp_candidate:
    translation_m: [0.000, -0.061, 0.000]
    quaternion_xyzw: [0.7071067811865476, 0.7071067811865476, 0.0, 0.0]
  object_to_right_tcp_candidate:
    translation_m: [0.000, 0.061, 0.000]
    quaternion_xyzw: [0.7071067811865476, -0.7071067811865476, 0.0, 0.0]
  isaac_hold_representation:
    source: reuse_task24_task11_surface_gripper
    status: REUSE_CANDIDATE_REQUIRES_TASK01_SANITY
    historical_capture_threshold_m: 0.003
    historical_stiffness: 1.0e4
    historical_damping: 1.0e3
    historical_break_force_N: 1.0e6
    historical_break_torque_Nm: 1.0e6
    note: Engineering hold abstraction only; not calibrated contact-wrench semantics.
  force_wrench_calibration: DEFERRED_TO_TASK10_IS
  geometric_validation_A: PASS_DENSE_START_TO_PRE_PUSH

rear_push_grasp:
  applies_to: B_constrained_insertion
  transition_role: FIXED_ENGINEERING_HANDOFF_NOT_SCORED_AS_P3_CONTROL
  pusher_arm: right
  helper_arm: left
  cube_contact_face: -X
  insertion_axis_world: [1.0, 0.0, 0.0]
  attachment: existing_surface_gripper_rear_regrasp
  helper_policy: park_outside_insertion_work_zone
  candidate_policy: reuse_task26_task27_full_chain_regrasp_push_exit_precheck
  insert_ready_state: PENDING_CAPTURE_AND_REVALIDATION

carriage:
  opening_side: -X
  insertion_axis_world: [1.0, 0.0, 0.0]
  interior_x_world_m: [0.910, 1.160]
  interior_y_world_m: [-0.303, 0.303]
  wall_thickness_m: 0.020
  wall_height_m: 0.150
  wall_top_world_z_m: 0.350

benchmarks:
  A_tight_transport:
    rail_state: *a_rail_state
    start_mode: both_side_suctions_closed_and_cube_stably_shared
    initial_cube_center_world_m: [0.550, 0.000, 0.380]
    initial_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    initial_robot_joint_state_rad: *benchmark_a_start_q
    target_name: PRE_PUSH_SHARED
    target_cube_center_world_m: [0.790, 0.000, 0.260]
    target_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    target_robot_joint_state_rad: *pre_push_shared_q
    success_tolerances: PENDING_USER_REVIEW
    force_metrics_required_for_pass: false

  handoff_pre_push_to_insert_ready:
    scientific_role: fixed_common_engineering_transition
    scored_as_p3_algorithm: false
    start_name: PRE_PUSH_SHARED
    start_cube_center_world_m: [0.790, 0.000, 0.260]
    start_rail_state: *a_rail_state
    output_rail_state: *insert_ready_rail_state
    fixed_rail_translation_world_m: 0.100
    require_bilateral_open_confirmed_before_rail_move: true
    require_safe_helper_and_pusher_before_rail_move: true
    require_measured_rails_and_bases: true
    require_planning_world_rebuild_after_rail_move: true
    forbid_pre_move_FCL_world_cache_after_move: true
    sequence:
      - release_both_side_suctions
      - confirm_bilateral_suction_open
      - move_helper_and_pusher_to_predecessor_safe_states
      - move_both_rails_to_fixed_0p750_station
      - verify_both_measured_rails_and_base_world_poses
      - rebuild_planning_world_with_world_shift_x_0p100
      - move_right_pusher_to_cube_minus_x_face
      - close_right_rear_surface_gripper
      - verify_attachment_and_common_collision_gates
    output_name: INSERT_READY
    output_cube_center_world_m: [0.790, 0.000, 0.260]
    output_robot_joint_state_rad: PENDING_CAPTURE_FROM_REUSED_TASK27_CENTER_FLOW

  B_constrained_insertion:
    start_name: INSERT_READY
    rail_state: *insert_ready_rail_state
    rail_station_is_controller_parameter: false
    start_cube_center_world_m: [0.790, 0.000, 0.260]
    start_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    target_cube_center_world_m: [1.100, 0.000, 0.260]
    target_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    commanded_translation_world_m: [0.310, 0.000, 0.000]
    contact_topology: single_right_rear_surface_gripper_push_after_bilateral_release
    expected_terminal_support: deep_wall_near_contact
    prior_engineering_deep_wall_gap_tolerance_m: 0.003
    formal_success_tolerances: PENDING_USER_REVIEW
    force_limits: DEFERRED_TO_P3
    jam_detection_thresholds: DEFERRED_TO_P3
    cases:
      C0_nominal: {lateral_offset_m: 0.0, yaw_error_rad: 0.0, friction_scale: 1.0}
      C1_small_lateral: {lateral_offset_m: PENDING_P3, yaw_error_rad: 0.0, friction_scale: 1.0}
      C2_larger_lateral: {lateral_offset_m: PENDING_P3, yaw_error_rad: 0.0, friction_scale: 1.0}
      C3_yaw: {lateral_offset_m: 0.0, yaw_error_rad: PENDING_P3, friction_scale: 1.0}
      C4_lateral_and_yaw: {lateral_offset_m: PENDING_P3, yaw_error_rad: PENDING_P3, friction_scale: 1.0}
      C5_friction: {lateral_offset_m: 0.0, yaw_error_rad: 0.0, friction_scale: PENDING_P3}

timing:
  physics_dt_s: 0.016666667
  physics_dt_basis: measured_task01_candidate
  controller_command_period_s: 0.010
  timestamp_policy: physics_post_step_simulation_time_only
  wall_time_for_scientific_metrics: false
  frequency_relation: PENDING_FINAL_FREEZE_REVIEW

trials:
  development_seed: 0
  regression_seeds: [0, 1, 2, 3, 4]
  final_trial_count_per_case: DEFERRED_TO_TASK27
  tuning_budget: DEFERRED_TO_TASK27

measurement_contract:
  pose_source: same_post_physics_step
  collision_distance_interface: TASK02
  contact_wrench_interface: TASK10_IS
  contact_wrench_blocks_task01: false
  joint_effort_is_contact_wrench: false
  required_fields:
    - simulation_stamp
    - frame_id
    - application_point_for_wrench_when_available

  insert_ready_required_fields:
    - left_right_rail_measured_x_m
    - left_right_base_world_pose
    - world_shift_x_m
    - planning_world_refresh_generation_and_ack
    - left_right_joint_state_rad
    - cube_world_pose
    - left_right_tcp_world_pose
    - left_suction_open_confirmed
    - right_rear_surface_gripper_closed_confirmed
    - right_attachment_relative_transform_and_source
    - helper_park_state
    - carriage_frame_world_pose
    - post_physics_simulation_timestamp_and_step

task01_validation:
  A_dense_geometry_already_passed: true
  require_A_surface_gripper_hold_sanity: true
  require_A_start_and_pre_push_reset_ready: true
  require_handoff_reuse_precheck: true
  require_insert_ready_capture: true
  require_B_rear_push_geometry_and_isaac_sanity: true
  require_force_calibration: false
  require_five_cube_flow: false
  superseded_validation:
    bilateral_side_grasp_pre_push_to_target:
      result: FAIL_ISAAC_TARGET_LINK7_DEEP_WALL
      use_for_current_B: false
      preserve_as_historical_negative_evidence: true

approval:
  one_cube_core_benchmark_rescope: CONFIRMED_2026-10-06
  benchmark_a_start_pose_candidate: CONFIRMED_2026-10-07_NEW_RESEARCH_DESIGN_NOT_TASK27_FEED
  staged_B_topology_reuse_prior_work: CONFIRMED_2026-10-08
  fixed_handoff_both_rails_0p750_candidate: CONFIRMED_2026-10-08_NOT_AN_OPTIMIZATION_VARIABLE
  nominal_effective_friction_0p5_0p5: CANDIDATE_REQUIRES_FINAL_FREEZE_REVIEW
  benchmark_freeze: PENDING
