# TASK01 core single-Cube candidate.
# Do not use for formal comparison until TASK01 is PASS and user marks it FROZEN.
schema_version: 2
benchmark_id: benchmark_v1
status: DRAFT
scientific_classification: ADAPTATION
scope: single_shared_cube_transport_and_constrained_insertion
units: {length: m, mass: kg, time: s, angle: rad, force: N, torque: Nm}

legacy:
  task27_five_cube_flow:
    role: application_demo_and_stress_test_only
    blocks_benchmark_freeze: false
    note: Historical evidence is preserved but is not the common SCI baseline.

frames:
  world: world
  cube: cube_center
  carriage_entrance:
    name: carriage_entrance
    origin_world_m: [0.910, 0.000, 0.200]
    quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    axes:
      x: insertion_forward
      y: carriage_width
      z: up
    validation: PENDING_SINGLE_CUBE_READY

robots:
  model: dual_fr3_side_suction
  left:
    base_at_rest_world_m: [0.650, -0.600, 0.000]
    rail_axis_world: [1.0, 0.0, 0.0]
    rail_x_limits_world_m: [0.450, 1.050]
    tcp_link: left_fr3_side_suction_tcp
  right:
    base_at_rest_world_m: [0.650, 0.600, 0.000]
    rail_axis_world: [1.0, 0.0, 0.0]
    rail_x_limits_world_m: [0.450, 1.050]
    tcp_link: right_fr3_side_suction_tcp
  benchmark_a_start_joint_state_rad: PENDING_CAPTURE
  benchmark_b_start_joint_state_rad: PENDING_CAPTURE

table:
  center_world_m: [0.550, 0.000, 0.100]
  size_m: [1.500, 0.800, 0.200]
  top_world_z_m: 0.200

cube:
  count: 1
  size_m: [0.120, 0.120, 0.120]
  mass_kg: 0.800
  nominal_center_z_m: 0.260
  nominal_material:
    static_friction: 0.50
    dynamic_friction: 0.50
    restitution: 0.0
  material_basis: measured_effective_in_inherited_task01_scene
  robustness_variation: DEFERRED_TO_P3

tool:
  type: fixed_L_side_suction_2x2
  vertical_drop_m: 0.080
  lateral_standoff_m: 0.130
  tcp_lateral_offset_from_link8_m: 0.155
  geometry_change_allowed_in_task01: false

shared_grasp:
  mode: rigid_shared_object_constraint
  object_to_left_tcp_candidate:
    translation_m: [0.000, -0.061, 0.000]
    quaternion_xyzw: [0.7071067811865476, 0.7071067811865476, 0.0, 0.0]
  object_to_right_tcp_candidate:
    translation_m: [0.000, 0.061, 0.000]
    quaternion_xyzw: [0.7071067811865476, -0.7071067811865476, 0.0, 0.0]
  physical_contact_calibration: DEFERRED_TO_P2_P3
  geometric_validation: PENDING_SINGLE_CUBE_PROBE

carriage:
  opening_side: -X
  insertion_axis_world: [1.0, 0.0, 0.0]
  interior_x_world_m: [0.910, 1.160]
  interior_y_world_m: [-0.303, 0.303]
  wall_thickness_m: 0.020
  wall_height_m: 0.150
  wall_top_world_z_m: 0.350

benchmarks:
  A_tight_transport:
    start_mode: both_side_suctions_closed_and_cube_stably_shared
    # [ADAPTATION] 用户2026-10-07确认的新科研START，不是旧Task27 feed pose。
    # 双臂已稳定共同持有Cube且已离桌；本基准不包含抓取过程。
    initial_cube_center_world_m: [0.550, 0.000, 0.380]
    initial_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    initial_robot_joint_state_rad: PENDING_CAPTURE
    target_name: PRE_PUSH
    target_cube_center_world_m: [0.790, 0.000, 0.260]
    target_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    success_tolerances: PENDING_USER_REVIEW
    force_metrics_required_for_pass: false

  B_constrained_insertion:
    start_name: PRE_PUSH
    start_cube_center_world_m: [0.790, 0.000, 0.260]
    start_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    target_cube_center_world_m: [1.100, 0.000, 0.260]
    target_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    commanded_translation_world_m: [0.310, 0.000, 0.000]
    contact_topology: dual_arm_shared_object_for_scientific_benchmark
    success_tolerances: PENDING_USER_REVIEW
    force_limits: DEFERRED_TO_P3
    jam_detection_thresholds: DEFERRED_TO_P3
    cases:
      C0_nominal: {lateral_offset_m: 0.0, yaw_error_rad: 0.0, friction_scale: 1.0}
      C1_small_lateral: {lateral_offset_m: PENDING_P3, yaw_error_rad: 0.0, friction_scale: 1.0}
      C2_larger_lateral: {lateral_offset_m: PENDING_P3, yaw_error_rad: 0.0, friction_scale: 1.0}
      C3_yaw: {lateral_offset_m: 0.0, yaw_error_rad: PENDING_P3, friction_scale: 1.0}
      C4_lateral_and_yaw: {lateral_offset_m: PENDING_P3, yaw_error_rad: PENDING_P3, friction_scale: 1.0}
      C5_friction: {lateral_offset_m: 0.0, yaw_error_rad: 0.0, friction_scale: PENDING_P3}

timing:
  physics_dt_s: 0.016666667
  physics_dt_basis: measured_task01_candidate
  controller_command_period_s: 0.010
  timestamp_policy: physics_post_step_simulation_time_only
  wall_time_for_scientific_metrics: false

trials:
  development_seed: 0
  regression_seeds: [0, 1, 2, 3, 4]
  final_trial_count_per_case: DEFERRED_TO_TASK27
  tuning_budget: DEFERRED_TO_TASK27

measurement_contract:
  pose_source: same_post_physics_step
  collision_distance_interface: TASK02
  contact_wrench_interface: TASK10_IS
  contact_wrench_blocks_task01: false
  joint_effort_is_contact_wrench: false
  required_fields:
    - simulation_stamp
    - frame_id
    - application_point_for_wrench_when_available

task01_validation:
  single_cube_geometry_samples: [START, PRE_PUSH, INSERT_10, INSERT_30, INSERT_50, INSERT_70, INSERT_100]
  require_dual_ik: true
  require_joint_limits: true
  require_full_fcl: true
  require_tool_carriage_clearance: true
  require_relative_grasp_consistency: true
  require_isaac_reset_ready: true
  require_force_calibration: false
  require_five_cube_flow: false
  geometry_probe_numeric:
    # [ENGINEERING] 仅探针数值求解设置，独立验收门限未放宽。
    lma_epsilon: 1.0e-7
    orientation_vs_position: 0.01
    translation_acceptance_m: 1.0e-5
    rotation_acceptance_rad: 1.0e-4
    max_cube_translation_step_m: 0.002

approval:
  one_cube_core_benchmark_rescope: CONFIRMED_2026-10-06
  benchmark_a_start_pose_candidate: CONFIRMED_2026-10-07_NEW_RESEARCH_DESIGN_NOT_TASK27_FEED
  nominal_effective_friction_0p5_0p5: CANDIDATE_REQUIRES_FINAL_FREEZE_REVIEW
  benchmark_freeze: PENDING
